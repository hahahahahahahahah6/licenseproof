[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "licenseproof"
version = "0.1.0"
description = "Check that a published Python artifact carries usable license information"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hao Li" }]
keywords = ["pypi", "packaging", "license", "compliance", "audit", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
licenseproof = "licenseproof.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/licenseproof"

[tool.setuptools.packages.find]
where = ["src"]
